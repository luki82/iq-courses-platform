<text x="690" y="320.0" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2A22" >Sew up holes</text>
<text x="400" y="405" font-size="18" font-weight="700" text-anchor="middle" fill="#198754" >Children under 5 and pregnant women first</text>
<text x="400" y="432" font-size="16" font-weight="400" text-anchor="middle" fill="#6B7280" >Replace your net every 3 to 5 years</text>
