<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t">
<title id="t">Mosquito net steps: hang it, tuck it under the mattress, sleep inside every night, sew up holes</title>
