<text x="253" y="375.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2A22" >very sleepy,</text><text x="253" y="392.5" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2A22" >can&#x27;t wake</text>
<circle cx="401" cy="320" r="32" fill="#fff" stroke="#B02A37" stroke-width="3"/>
<path transform="translate(401,320)" d="M-14,0 q7,-12 14,0 t14,0" fill="none" stroke="#B02A37" stroke-width="4" stroke-linecap="round"/>
<text x="401" y="375.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2A22" >hard to</text><text x="401" y="392.5" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2A22" >breathe</text>
<circle cx="549" cy="320" r="32" fill="#fff" stroke="#B02A37" stroke-width="3"/>
<path transform="translate(549,320)" d="M-10,-14 v28 M10,-14 v28" fill="none" stroke="#B02A37" stroke-width="4" stroke-linecap="round"/>
<text x="549" y="375.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2A22" >can&#x27;t drink</text><text x="549" y="392.5" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2A22" >or feed</text>
<circle cx="697" cy="320" r="32" fill="#fff" stroke="#B02A37" stroke-width="3"/>
<path transform="translate(697,320)" d="M-12,0 a12,8 0 1 0 24,0 a12,8 0 1 0 -24,0" fill="none" stroke="#B02A37" stroke-width="4" stroke-linecap="round"/>
<text x="697" y="375.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2A22" >dark urine /</text><text x="697" y="392.5" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2A22" >yellow eyes</text>
