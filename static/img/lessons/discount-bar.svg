<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t">
<title id="t">Bar diagram: $80 split into four $20 quarters. 25% off means you save one quarter, $20, and pay three quarters, $60</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16301F"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B02A37"/>
  </marker>
</defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}</style>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="40" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2A22" >A $80 jacket, 25% off</text>
<rect x="80" y="90" width="640" height="70" rx="10" fill="#F5F1E6" stroke="#DDD5BF" stroke-width="2"/>
<text x="160.0" y="135" font-size="22" font-weight="700" text-anchor="middle" fill="#1F2A22" >$20</text>
<text x="320.0" y="135" font-size="22" font-weight="700" text-anchor="middle" fill="#1F2A22" >$20</text>
<line x1="240.0" y1="90" x2="240.0" y2="160" stroke="#DDD5BF" stroke-width="2"/>
<text x="480.0" y="135" font-size="22" font-weight="700" text-anchor="middle" fill="#1F2A22" >$20</text>
<line x1="400.0" y1="90" x2="400.0" y2="160" stroke="#DDD5BF" stroke-width="2"/>
<text x="640.0" y="135" font-size="22" font-weight="700" text-anchor="middle" fill="#1F2A22" >$20</text>
<line x1="560.0" y1="90" x2="560.0" y2="160" stroke="#DDD5BF" stroke-width="2"/>
<text x="400" y="80" font-size="16" font-weight="400" text-anchor="middle" fill="#6B7280" >$80 = 4 quarters of $20</text>
<rect x="80" y="230" width="480.0" height="70" rx="10" fill="#D1E7DD" stroke="#198754" stroke-width="2"/>
<rect x="568.0" y="230" width="152.0" height="70" rx="10" fill="#F8D7DA" stroke="#B02A37" stroke-width="2" stroke-dasharray="6 5"/>
<text x="320.0" y="274" font-size="24" font-weight="700" text-anchor="middle" fill="#198754" >You pay 75% = $60</text>
<text x="644.0" y="274" font-size="20" font-weight="700" text-anchor="middle" fill="#B02A37" >Save $20</text>
<line x1="400" y1="168" x2="400" y2="222" stroke="#16301F" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="80" y="330" width="640" height="100" rx="14" fill="#fff" stroke="#DDD5BF" stroke-width="2"/>
<text x="400" y="368" font-size="20" font-weight="700" text-anchor="middle" fill="#1F2A22" >Quick way: 25% off → pay 75%</text>
<text x="400" y="405" font-size="26" font-weight="700" text-anchor="middle" fill="#198754" >0.75 × $80 = $60</text>
</svg>
