<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t">
<title id="t">The central bank prints notes and coins, about 3 percent of money, and sets interest rates. Commercial banks create about 97 percent of money by lending: a loan creates a new deposit. When the loan is repaid, that money disappears.</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16301F"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B02A37"/>
  </marker>
</defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}</style>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" font-size="22" font-weight="700" text-anchor="middle" fill="#1F2A22" >Where money comes from</text>
<rect x="20" y="60" width="230" height="330" rx="14" fill="#F5F1E6" stroke="#DDD5BF" stroke-width="2"/><g transform="translate(135,140) scale(1.0)"><path d="M-56,-18 L0,-50 L56,-18 Z" fill="#f0e2b6" stroke="#8a826e" stroke-width="2"/><rect x="-52" y="-18" width="104" height="44" fill="#f0e2b6" stroke="#8a826e" stroke-width="2"/><rect x="-40" y="-18" width="10" height="40" fill="#fff" stroke="#8a826e" stroke-width="1.5"/><rect x="-18" y="-18" width="10" height="40" fill="#fff" stroke="#8a826e" stroke-width="1.5"/><rect x="4" y="-18" width="10" height="40" fill="#fff" stroke="#8a826e" stroke-width="1.5"/><rect x="26" y="-18" width="10" height="40" fill="#fff" stroke="#8a826e" stroke-width="1.5"/><rect x="-58" y="26" width="116" height="8" fill="#8a826e"/><text x="0" y="-26" font-size="10" font-weight="800" text-anchor="middle" fill="#1F2A22" ></text></g>
<text x="135" y="215.0" font-size="19" font-weight="700" text-anchor="middle" fill="#1F2A22" >Central bank</text>
<text x="135" y="250" font-size="14" font-weight="600" text-anchor="middle" fill="#6B7280" >prints notes and coins</text><text x="135" y="272" font-size="14" font-weight="600" text-anchor="middle" fill="#6B7280" >sets interest rates</text><text x="135" y="294" font-size="14" font-weight="600" text-anchor="middle" fill="#6B7280" >watches over banks</text>
<g transform="translate(100,340) scale(1.0)"><rect x="-26" y="-15" width="52" height="30" rx="4" fill="#9fd08a" stroke="#4f8a3c" stroke-width="2"/><circle cx="0" cy="0" r="9" fill="none" stroke="#4f8a3c" stroke-width="2"/><text x="0" y="5" font-size="12" font-weight="800" text-anchor="middle" fill="#2f5e22" >$</text></g><g transform="translate(170,345) scale(1.0)"><rect x="-26" y="-15" width="52" height="30" rx="4" fill="#9fd08a" stroke="#4f8a3c" stroke-width="2"/><circle cx="0" cy="0" r="9" fill="none" stroke="#4f8a3c" stroke-width="2"/><text x="0" y="5" font-size="12" font-weight="800" text-anchor="middle" fill="#2f5e22" >$</text></g>
<text x="135" y="378" font-size="15" font-weight="700" text-anchor="middle" fill="#16301F" >about 3% of money</text>
<line x1="252" y1="225" x2="292" y2="225" stroke="#16301F" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="295" y="60" width="230" height="330" rx="14" fill="#F5F1E6" stroke="#DDD5BF" stroke-width="2"/><g transform="translate(410,140) scale(1.0)"><path d="M-56,-18 L0,-50 L56,-18 Z" fill="#e8e1cf" stroke="#8a826e" stroke-width="2"/><rect x="-52" y="-18" width="104" height="44" fill="#e8e1cf" stroke="#8a826e" stroke-width="2"/><rect x="-40" y="-18" width="10" height="40" fill="#fff" stroke="#8a826e" stroke-width="1.5"/><rect x="-18" y="-18" width="10" height="40" fill="#fff" stroke="#8a826e" stroke-width="1.5"/><rect x="4" y="-18" width="10" height="40" fill="#fff" stroke="#8a826e" stroke-width="1.5"/><rect x="26" y="-18" width="10" height="40" fill="#fff" stroke="#8a826e" stroke-width="1.5"/><rect x="-58" y="26" width="116" height="8" fill="#8a826e"/><text x="0" y="-26" font-size="10" font-weight="800" text-anchor="middle" fill="#1F2A22" ></text></g>
<text x="410" y="215.0" font-size="19" font-weight="700" text-anchor="middle" fill="#1F2A22" >Commercial bank</text>
<text x="410" y="250" font-size="14" font-weight="600" text-anchor="middle" fill="#6B7280" >lends to Amina</text><text x="410" y="272" font-size="14" font-weight="600" text-anchor="middle" fill="#6B7280" >and types new money</text><text x="410" y="294" font-size="14" font-weight="600" text-anchor="middle" fill="#6B7280" >into her account</text>
<rect x="355" y="318" width="110" height="46" rx="6" fill="#fff" stroke="#16301F" stroke-width="2"/><text x="410" y="340" font-size="13" font-weight="700" text-anchor="middle" fill="#16301F" >Loan: +$1,000</text><text x="410" y="357" font-size="11" font-weight="600" text-anchor="middle" fill="#6B7280" >new deposit</text>
<text x="410" y="383" font-size="15" font-weight="700" text-anchor="middle" fill="#16301F" >about 97% of money</text>
<line x1="527" y1="225" x2="567" y2="225" stroke="#16301F" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="570" y="60" width="210" height="330" rx="14" fill="#F5F1E6" stroke="#DDD5BF" stroke-width="2"/><g transform="translate(675,172) scale(0.8)"><circle cx="0" cy="-58" r="14" fill="#8d5524"/>
  <path d="M-20,-38 q20,-10 40,0 l6,40 h-52 z" fill="#198754"/>
  <rect x="-16" y="2" width="12" height="34" rx="5" fill="#3b3b3b"/>
  <rect x="4" y="2" width="12" height="34" rx="5" fill="#3b3b3b"/></g>
<text x="675" y="230.0" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2A22" >Amina spends it</text>
<text x="675" y="262" font-size="14" font-weight="600" text-anchor="middle" fill="#6B7280" >the money moves</text><text x="675" y="284" font-size="14" font-weight="600" text-anchor="middle" fill="#6B7280" >to other people&#x27;s</text><text x="675" y="306" font-size="14" font-weight="600" text-anchor="middle" fill="#6B7280" >bank accounts</text>
<text x="675" y="370" font-size="14" font-weight="700" text-anchor="middle" fill="#B02A37" >repay the loan →</text><text x="675" y="388" font-size="14" font-weight="700" text-anchor="middle" fill="#B02A37" >that money disappears</text>
<text x="400" y="432" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2A22" >When a bank makes a loan, it creates a matching deposit.</text>
</svg>
