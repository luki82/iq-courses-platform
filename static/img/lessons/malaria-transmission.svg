<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t">
<title id="t">How malaria spreads: a mosquito bites a sick person, parasites grow in the mosquito, it bites a healthy person, who gets sick 10 to 15 days later</title>
