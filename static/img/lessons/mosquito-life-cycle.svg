  <ellipse cx="2" cy="-14" rx="20" ry="8" fill="#cfe3f0" stroke="#7aa6c2" stroke-width="1" opacity="0.9" transform="rotate(-50 2 -14)"/>
  <path d="M-8,4 q-6,10 -12,22" fill="none" stroke="#2b2b2b" stroke-width="1.6"/><path d="M-2,4 q-3,10 -6,22" fill="none" stroke="#2b2b2b" stroke-width="1.6"/><path d="M4,4 q3,10 6,22" fill="none" stroke="#2b2b2b" stroke-width="1.6"/><path d="M-8,4 q-2,10 -4,22" fill="none" stroke="#2b2b2b" stroke-width="1.6"/><path d="M0,4 q1,10 2,22" fill="none" stroke="#2b2b2b" stroke-width="1.6"/><path d="M6,4 q6,10 12,22" fill="none" stroke="#2b2b2b" stroke-width="1.6"/>
  <ellipse cx="-14" cy="0" rx="22" ry="5" fill="#2b2b2b"/>
  <ellipse cx="10" cy="-1" rx="8" ry="6" fill="#2b2b2b"/>
  <circle cx="21" cy="-2" r="5" fill="#2b2b2b"/>
  <line x1="25" y1="-1" x2="44" y2="6" stroke="#2b2b2b" stroke-width="2"/>
</g>
<path d="M692.5,86 C692.5,28 107.5,28 107.5,84" fill="none" stroke="#B02A37" stroke-width="3" marker-end="url(#arrow-red)"/>
<text x="400" y="82" font-size="15" font-weight="700" text-anchor="middle" fill="#B02A37" >the female lays new eggs on water</text>
<text x="400" y="430" font-size="16" font-weight="700" text-anchor="middle" fill="#198754" >Remove standing water every week, before larvae can become adults</text>
</svg>
