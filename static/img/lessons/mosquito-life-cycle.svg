<line x1="587" y1="200" x2="603" y2="200" stroke="#16301F" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="605" y="90" width="175" height="300" rx="14" fill="#fff" stroke="#DDD5BF" stroke-width="2"/>
<circle cx="629" cy="114" r="16" fill="#16301F"/><text x="629" y="120" font-size="17" font-weight="700" text-anchor="middle" fill="#fff" >4</text>
<text x="692.5" y="122" font-size="22" font-weight="700" text-anchor="middle" fill="#1F2A22" >Adult</text>
<text x="692.5" y="370" font-size="15" font-weight="600" text-anchor="middle" fill="#6B7280" >flies and bites</text>
<g transform="translate(682.5,230) rotate(-10) scale(1.8)">
