<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t">
<title id="t">Keep mosquitoes out: 1 close the gap under the roof, 2 put screens on windows, 3 close doors at dusk, 4 remove standing water every week</title>
