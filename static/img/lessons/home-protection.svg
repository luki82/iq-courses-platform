<text x="500" y="122" font-size="17" font-weight="700" text-anchor="start" fill="#1F2A22" >Close the gap under the roof</text><text x="500" y="146" font-size="14" font-weight="400" text-anchor="start" fill="#6B7280" >use mud, wood or mesh</text>
<rect x="450" y="175" width="330" height="72" rx="14" fill="#F5F1E6" stroke="#DDD5BF" stroke-width="2"/><circle cx="476" cy="211" r="15" fill="#E08A1E"/><text x="476" y="217" font-size="17" font-weight="700" text-anchor="middle" fill="#fff" >2</text>
<text x="500" y="207" font-size="17" font-weight="700" text-anchor="start" fill="#1F2A22" >Put screens on windows</text><text x="500" y="231" font-size="14" font-weight="400" text-anchor="start" fill="#6B7280" >wire or plastic mesh</text>
<rect x="450" y="260" width="330" height="72" rx="14" fill="#F5F1E6" stroke="#DDD5BF" stroke-width="2"/><circle cx="476" cy="296" r="15" fill="#E08A1E"/><text x="476" y="302" font-size="17" font-weight="700" text-anchor="middle" fill="#fff" >3</text>
<text x="500" y="292" font-size="17" font-weight="700" text-anchor="start" fill="#1F2A22" >Close doors at dusk</text><text x="500" y="316" font-size="14" font-weight="400" text-anchor="start" fill="#6B7280" >when mosquitoes start biting</text>
<rect x="450" y="345" width="330" height="72" rx="14" fill="#F5F1E6" stroke="#DDD5BF" stroke-width="2"/><circle cx="476" cy="381" r="15" fill="#E08A1E"/><text x="476" y="387" font-size="17" font-weight="700" text-anchor="middle" fill="#fff" >4</text>
<text x="500" y="377" font-size="17" font-weight="700" text-anchor="start" fill="#1F2A22" >Remove standing water</text><text x="500" y="401" font-size="14" font-weight="400" text-anchor="start" fill="#6B7280" >every week</text>
